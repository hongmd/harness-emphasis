name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      # Tests need the `claude` binary; it has no auth requirement for `plugin test`/`validate`.
      # No ANTHROPIC_API_KEY here on purpose: with none, the CLI runs this repo's own code.
      - run: npm i -g @anthropic-ai/claude-code
      - run: mise run typecheck
      - run: mise run test
      - run: mise run validate

  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag and release if this version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(jq -r .version .claude-plugin/plugin.json)"
          if gh release view "$tag" --json tagName >/dev/null 2>&1; then
            echo "$tag already released; nothing to do"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --generate-notes --title "$tag"
          fi
