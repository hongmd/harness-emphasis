[tools]
node = "26"
"npm:typescript" = "7"

# src/ imports nothing outside the standard library, so it type-checks without the engine's
# declarations. hooks/register.ts imports claude-code and is only checked by `claude plugin validate`.
[tasks.typecheck]
description = "Type-check src/ on its own, with no config file"
run = "tsc --noEmit --strict --target es2022 --module esnext src/*.ts"

[tasks.test]
description = "Run the plugin's tests"
run = "claude plugin test ."

[tasks.validate]
description = "Validate the manifest and the hooks module the way the engine will"
run = "claude plugin validate ."

[tasks.changelog]
description = "Check that CHANGELOG.md matches the version and its links"
run = "node scripts/changelog.mjs"

[tasks.check]
description = "Type-check, test, validate and check the changelog"
depends = ["typecheck", "test", "validate", "changelog"]
